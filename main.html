<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
	  <table border="1" width="100%" cellspacing="5" cellpadding="10">

    <!-- Row 1 -->
    <tr>

        <!-- Nested Table 2 -->
        <td width="50%" height="500">
            <table border="1" width="100%" cellspacing="5" cellpadding="5">
                <tr>
                    <th colspan="2">Nested Table 2</th>
                </tr>

                <tr>
                    <th>Column 1</th>
                    <th>Column 2</th>
                </tr>

                <tr>
                    <td align="center">abc</td>
                    <td align="center">def</td>
                </tr>
            </table>
        </td>

        <!-- Nested Table 1 -->
        <td width="50%">
            <table border="1" width="100%" cellspacing="5" cellpadding="10">
                <tr>
                    <th>Nested Table 1</th>
                </tr>

                <tr>
                    <td>
                        <ul>
                            <li>List item 1</li>
                            <li>List item 2</li>
                            <li>List item 3</li>
                        </ul>
                    </td>
                </tr>
            </table>
        </td>

    </tr>

    <!-- Row 2 -->
    <tr>

        <!-- Nested Table 3 -->
        <td>
            <table border="1" width="100%" cellspacing="5" cellpadding="5">
                <tr>
                    <th colspan="2">Nested Table 3</th>
                </tr>

                <tr>
                    <td align="center">
                        <a href="#">Nested Table</a>
                    </td>

                    <td align="center">
                        Demo Continued
                    </td>
                </tr>
            </table>
        </td>

        <!-- Nested Table 4 -->
        <td>
            <table border="1" width="100%" cellspacing="5" cellpadding="5">
                <tr>
                    <th>Nested Table 4</th>
                </tr>

                <tr>
                    <td align="center"
                        style="background-color: black; color: white;">
                        HTML
                    </td>
                </tr>
            </table>
        </td>

    </tr>

	  </table>
   
  </body>
</html>
